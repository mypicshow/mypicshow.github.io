<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Pic Show</title>
<meta name="description" content="Photographs and albums. Tap a photo to see it full size.">
<meta property="og:type" content="website">
<meta property="og:title" content="My Pic Show">
<meta property="og:description" content="Photographs and albums. Tap a photo to see it full size.">
<meta property="og:url" content="https://mypicshow.github.io/">
<meta property="og:image" content="https://mypicshow.github.io/photos/test/dsc2958-edit-thumb.jpg">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="theme-color" content="#0d1413" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: sticky header over one centred column. Photos sit in justified rows (Flickr-style mosaic). A full-screen viewer opens on top for a single photo. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#13201f; --muted:#566866; --line:#d8e1df; --tile:#e2eae8;
  --accent:#0a766f; --accent-fg:#ffffff;
  --lb-bg:#0a0f0f; --lb-fg:#eef4f3; --lb-muted:#9fb2af; --lb-line:#2a3a37; --lb-btn:#18221f; --lb-accent:#5ccfc6; --lb-accent-fg:#06211f;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Space Grotesk","Inter",system-ui,-apple-system,sans-serif;
  --font-brand:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --gap:6px; --maxw:1180px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1413; --surface:#141d1c; --fg:#e7efee; --muted:#93a7a4; --line:#243230; --tile:#1b2625;
    --accent:#5ccfc6; --accent-fg:#06211f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#141d1c; --fg:#e7efee; --muted:#93a7a4; --line:#243230; --tile:#1b2625;
  --accent:#5ccfc6; --accent-fg:#06211f; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--font-display);letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;font-weight:700}
h2{font-size:20px;line-height:1.2;font-weight:700}
.sub{color:var(--muted);max-width:60ch}

.inner{max-width:var(--maxw);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.head-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:10px}
.brand{display:inline-flex;align-items:center;gap:10px;font:500 20px/1 var(--font-brand);text-decoration:none}
.brand .logo{width:40px;height:40px;border-radius:22.4%;box-shadow:0 0 0 1px var(--line)}
.pill{font:500 11px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 8px}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--tile)}
.head-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;font-weight:500}
.hbtn:hover{border-color:var(--muted)}
@media (max-width:640px){.hbtn{width:40px;padding:0}.hbtn span{display:none}}
@media (max-width:560px){.nav{order:3;flex-basis:100%;margin-left:-10px}}

/* page */
#view{display:flex;flex-direction:column;gap:32px;padding-block:24px 56px}
.intro{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:14px}
.crumb{display:inline-block;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:6px}
.crumb:hover{color:var(--fg)}

.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 12px}
.album-card{position:relative}
.album-link{display:flex;flex-direction:column;text-decoration:none}
.cover{aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:4px;background:var(--tile);margin-bottom:8px}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.album-link:hover .cover img,.album-link:focus-visible .cover img{transform:scale(1.04)}
.a-name{font-weight:600}
.a-count{color:var(--muted);font-size:13px}

.photo-grid{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;gap:var(--gap)}
.tile{position:relative;display:block;min-width:0;border-radius:3px;overflow:hidden;background:var(--tile)}
.tile-btn{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.tile-btn img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.cap{position:absolute;inset:auto 0 0 0;padding:30px 10px 8px;text-align:left;font:500 13px/1.3 var(--font-body);color:#fff;background:linear-gradient(to top,rgba(0,0,0,.66),transparent);opacity:0;transition:opacity .15s}
.tile:hover .cap,.tile-btn:focus-visible .cap{opacity:1}
.tile-btn:focus-visible{outline-offset:-3px}

.btn{min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn-accent{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn-accent:hover{border-color:transparent;filter:brightness(1.08)}
.head-line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.share-btn{display:inline-flex;align-items:center;gap:8px}
.chip{position:absolute;top:8px;right:8px;z-index:2;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:rgba(10,15,15,.62);color:#fff;cursor:pointer;transition:opacity .15s,background .15s}
.chip:hover{background:rgba(10,15,15,.84)}
.tile .chip{top:6px;right:6px;width:34px;height:34px}
@media (hover:hover){.tile .chip{opacity:0}.tile:hover .chip,.tile:focus-within .chip{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,12px);z-index:40;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:500;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:rgba(0,0,0,.5);padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.sheet-card input{min-width:0;min-height:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.sheet-card p{color:var(--muted);font-size:13px}

/* how it works */
.how{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px 40px;align-items:start}
@media (max-width:780px){.how{grid-template-columns:minmax(0,1fr)}}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.steps b{display:block;font-weight:600}
.steps span{color:var(--muted)}
.tree{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-x:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;list-style:none;margin:0;padding:0}
.flow li{display:flex;align-items:center;gap:8px}
.flow li+li::before{content:"\2192";color:var(--muted)}
.flow span{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500}
.notes{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.notes p{color:var(--muted)}
.notes b{color:var(--fg);font-weight:600}

.foot{padding-block:20px 32px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

/* photo viewer (dark in both themes) */
.lb{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto minmax(180px,1fr) auto auto auto;background:var(--lb-bg);color:var(--lb-fg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:auto}
.lb>*{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.lb :focus-visible{outline-color:var(--lb-accent)}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.lb-link{color:var(--lb-fg);text-decoration:none;font-weight:600;padding:8px 0}
.lb-link:hover{text-decoration:underline}
.lb-count{color:var(--lb-muted);font-variant-numeric:tabular-nums;margin-left:auto}
.lb-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--lb-line);background:var(--lb-btn);cursor:pointer}
.lb-btn:hover{border-color:var(--lb-muted)}
.lb-stage{position:relative;min-height:0}
.lb-stage img{position:absolute;inset:6px max(16px,env(safe-area-inset-left,0px));width:calc(100% - 2 * max(16px,env(safe-area-inset-left,0px)));height:calc(100% - 12px);object-fit:contain;-webkit-user-drag:none;user-select:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,15,15,.72)}
.lb-nav.prev{left:max(10px,env(safe-area-inset-left,0px))}
.lb-nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.lb-info{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px}
.lb-text{min-width:0;flex:1 1 260px}
.lb-text h2{font-size:18px}
.lb-text p{color:var(--lb-muted);font-size:13px;margin-top:2px}
.lb .btn-accent{background:var(--lb-accent);color:var(--lb-accent-fg)}
.lb .btn-ghost{background:var(--lb-btn);border-color:var(--lb-line);color:var(--lb-fg)}
.lb .btn-ghost:hover{border-color:var(--lb-muted)}
.lb-actions{display:flex;flex-wrap:wrap;gap:8px}
.buy{padding-bottom:12px}
.buy-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
a.opt{text-decoration:none;color:var(--lb-fg)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;padding:10px 12px;border-radius:6px;border:1px solid var(--lb-line);background:var(--lb-btn);cursor:pointer}
.opt:hover{border-color:var(--lb-muted)}
.opt[aria-pressed="true"]{border-color:var(--lb-accent)}
.opt span{font-weight:600}
.opt small{grid-column:1;color:var(--lb-muted);font-size:12.5px}
.opt b{grid-column:2;grid-row:1 / span 2;align-self:center;font-variant-numeric:tabular-nums}
.buy-note{margin-top:8px;color:var(--lb-muted);font-size:13px}
.lb-strip{position:relative;display:flex;gap:6px;overflow-x:auto;padding-block:6px 14px}
.th{flex:none;height:52px;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:var(--lb-btn);cursor:pointer;opacity:.6}
.th img{width:100%;height:100%;object-fit:cover}
.th[aria-current="true"]{border-color:var(--lb-accent);opacity:1}
/* full screen: hide the site furniture and keep the photos */
.exit-full{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));z-index:35;width:44px;height:44px;padding:0;place-items:center;border:0;border-radius:50%;background:rgba(10,15,15,.66);color:#fff;cursor:pointer}
.exit-full:hover{background:rgba(10,15,15,.88)}
body.clean .exit-full{display:grid}
body.clean .site-head,body.clean .foot,body.clean .intro,body.clean .sec>h2{display:none}
body.clean #view{padding-block:12px}
body.clean .lb{grid-template-rows:minmax(0,1fr)}
body.clean .lb-top,body.clean .lb-info,body.clean .buy,body.clean .lb-strip{display:none}
@media (max-width:560px){:root{--gap:4px}.lb-nav{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <header class="site-head">
    <div class="inner head-row">
      <a class="brand" id="brand" href="#" aria-label="My Pic Show home">
        <img class="logo" src="icon.svg" alt="" width="32" height="32">        <span id="brand-name">My Pic Show</span>
      </a>
      <div class="head-actions">
        <button class="hbtn" id="full-btn" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full screen</span></button>
        <button class="hbtn" id="share-site" type="button" aria-label="Share site"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Share site</span></button>
        <button class="hbtn" id="theme-btn" type="button"></button>
      </div>

    <button class="lb-btn" id="lb-close" type="button" aria-label="Close photo">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <img id="lb-img" alt="" draggable="false">
    <button class="lb-btn lb-nav prev" id="lb-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-btn lb-nav next" id="lb-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

      <button class="btn btn-accent" id="buy-toggle" type="button" aria-expanded="false" aria-controls="buy-panel">Buy this photo</button>

<button class="exit-full" id="exit-full" type="button" aria-label="Exit full screen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    <h2 id="sheet-title">Link</h2>

<script>
var DEMO=/*MODE*/false/*/MODE*/;
var ALBUMS=[],PHOTOS=[],MIXED=[],SITE={title:'My Pic Show',short:'MPS',buy:[]};
function slugify(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}


/* Mix the albums together for the front page: first photo of each album, then the second, and so on. */
function buildMixed(){
  MIXED=[];
  var most=0;ALBUMS.forEach(function(a){if(a.photos.length>most)most=a.photos.length});
  for(var i=0;i<most;i++)ALBUMS.forEach(function(a){if(a.photos[i])MIXED.push(a.photos[i])});
}

/* Turn gallery.json (written by publish.sh) into the album and photo lists the page uses.
   File names follow one pattern: photos/<album>/<id>-thumb.jpg, -medium.jpg and -large.jpg. */
function parseGallery(g){
  SITE.title=g.title||'My Pic Show';SITE.short=g.short||SITE.title;
  SITE.buy=(g.buy||[]).filter(function(o){return o&&o.link});
  ALBUMS=[];PHOTOS=[];
  (g.albums||[]).forEach(function(ga){
    var a={name:ga.name,slug:ga.slug,blurb:ga.blurb||'',photos:[]};
    (ga.photos||[]).forEach(function(gp,pi){
      var base='photos/'+ga.slug+'/'+gp.id,t=gp.t,m=gp.m,l=gp.l;
      var sets=[[base+'-thumb.jpg',t[0]],[base+'-medium.jpg',m[0]],[base+'-large.jpg',l[0]]].sort(function(x,y){return x[1]-y[1]});
      var seen={},ss=[];
      sets.forEach(function(s){if(!seen[s[1]]){seen[s[1]]=1;ss.push(s[0]+' '+s[1]+'w')}});
      var p={id:gp.id,title:gp.title,ar:l[0]/l[1],album:a,idx:pi,ow:gp.ow,oh:gp.oh,ww:l[0],wh:l[1],
        src:base+'-thumb.jpg',full:base+'-medium.jpg',srcset:ss.join(', ')};
      a.photos.push(p);PHOTOS.push(p);
    });
    if(a.photos.length){a.cover=a.photos[0].src;ALBUMS.push(a)}
  });
  buildMixed();
}

function startApp(){
var $=function(s,el){return (el||document).querySelector(s)};
var root=document.documentElement;

/* ---------- theme: follows the device, button flips it, choice is remembered ---------- */
var KEY='mypicshow-theme',tbtn=$('#theme-btn');
var SUN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var mq=window.matchMedia('(prefers-color-scheme: dark)');
function effective(){return root.getAttribute('data-theme')||(mq.matches?'dark':'light')}
function paintBtn(){var d=effective()==='dark';tbtn.innerHTML=(d?SUN:MOON)+'<span>'+(d?'Light':'Dark')+'</span>';tbtn.setAttribute('aria-label','Switch to '+(d?'light':'dark')+' mode')}
try{var sv=localStorage.getItem(KEY);if(sv==='light'||sv==='dark')root.setAttribute('data-theme',sv)}catch(e){}
tbtn.addEventListener('click',function(){var n=effective()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem(KEY,n)}catch(e){}paintBtn()});
if(mq.addEventListener)mq.addEventListener('change',paintBtn);
paintBtn();

/* ---------- sharing: phone share sheet where available, otherwise copy the link ---------- */
var SHARE_ICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function baseUrl(){return location.href.split('#')[0]}
function siteUrl(){return baseUrl()}
function bySlug(s){return ALBUMS.filter(function(x){return x.slug===s})[0]}
function albumUrl(a){return baseUrl()+'#album-'+a.slug}
function photoUrl(p){return baseUrl()+'#photo-'+p.album.slug+'--'+p.id}
var toastEl=$('#toast'),toastT=0,sheet=$('#sheet'),sheetInp=$('#sheet-link'),sheetTitle=$('#sheet-title'),sheetFrom=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on')},2400)}
function openSheet(url,what){sheetFrom=document.activeElement;sheetTitle.textContent=what+' link';sheetInp.value=url;sheet.hidden=false;sheetInp.focus();sheetInp.select()}
function closeSheet(){sheet.hidden=true;if(sheetFrom&&document.contains(sheetFrom))sheetFrom.focus()}
function copyLink(url,what){
  var p;try{p=navigator.clipboard.writeText(url)}catch(e){p=Promise.reject(e)}
  p.then(function(){toast(what+' link copied')},function(){openSheet(url,what)});
}
function doShare(url,title,what){
  if(navigator.share){
    var s;try{s=navigator.share({title:title,url:url})}catch(e){s=Promise.reject(e)}
    s.catch(function(e){if(!(e&&e.name==='AbortError'))copyLink(url,what)});
    return;
  }
  copyLink(url,what);
}
function chipEl(label,fn){var c=document.createElement('button');c.type='button';c.className='chip';c.setAttribute('aria-label',label);c.innerHTML=SHARE_ICON;c.addEventListener('click',fn);return c}
$('#sheet-done').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});

/* ---------- justified rows ---------- */
var view=$('#view'),cleanup=[];
function tileEl(p){
  var t=document.createElement('div');t.className='tile';
  var b=document.createElement('button');b.type='button';b.className='tile-btn';
  b.setAttribute('aria-label','Open '+p.title+', '+p.album.name);
  var img=document.createElement('img');img.loading='lazy';img.decoding='async';img.src=p.src;img.alt='';img.draggable=false;
  var cap=document.createElement('span');cap.className='cap';cap.textContent=p.title;
  b.appendChild(img);b.appendChild(cap);
  b.addEventListener('click',function(){openLB(p,b)});
  var c=chipEl('Share photo: '+p.title,function(){doShare(photoUrl(p),p.title+' · '+SITE.title,'Photo')});
  t.appendChild(b);t.appendChild(c);
  return t;
}
function justify(box,photos){
  var W=Math.floor(box.clientWidth);if(!W)return;
  var gap=parseFloat(getComputedStyle(box).getPropertyValue('--gap'))||6;
  var target=W<520?130:W<900?190:230;
  box.textContent='';
  var row=[],sum=0;
  function flush(last){
    var h=(W-gap*(row.length-1))/sum,full=true;
    if(last&&h>target*1.25){h=target;full=false}
    var el=document.createElement('div');el.className='row';el.style.height=h+'px';
    row.forEach(function(p){var t=tileEl(p);if(full)t.style.flex=p.ar+' 1 0px';else t.style.width=(h*p.ar)+'px';el.appendChild(t)});
    box.appendChild(el);row=[];sum=0;
  }
  photos.forEach(function(p){row.push(p);sum+=p.ar;if((W-gap*(row.length-1))/sum<=target)flush(false)});
  if(row.length)flush(true);
}
function mountGrid(box,photos){
  var lastW=0;
  function draw(){var w=box.clientWidth;if(w===lastW)return;lastW=w;justify(box,photos)}
  function setList(list){photos=list;lastW=0;draw()}
  draw();
  if('ResizeObserver' in window){var ro=new ResizeObserver(draw);ro.observe(box);cleanup.push(function(){ro.disconnect()})}
  else{window.addEventListener('resize',draw);cleanup.push(function(){window.removeEventListener('resize',draw)})}
  return setList;
}

/* ---------- views ---------- */
function setNav(r){document.querySelectorAll('.nav a').forEach(function(a){if(a.getAttribute('data-r')===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function plural(n,w){return n+' '+w+(n===1?'':'s')}

var PAGE=60;
function renderHome(){
  setNav('home');
  var cards=ALBUMS.map(function(a){return '<div class="album-card"><a class="album-link" href="#album-'+a.slug+'"><span class="cover"><img src="'+a.cover+'" alt="" loading="lazy" decoding="async"></span><span class="a-name">'+a.name+'</span><span class="a-count">'+plural(a.photos.length,'photo')+'</span></a><button class="chip" type="button" data-slug="'+a.slug+'" aria-label="Share album: '+a.name+'">'+SHARE_ICON+'</button></div>'}).join('');
  view.innerHTML=
    '<section class="sec" aria-labelledby="h-albums"><h2 id="h-albums">Albums</h2><div class="albums">'+cards+'</div></section>'+
    '<section class="sec" aria-labelledby="h-all"><h2 id="h-all">All photos</h2><div class="photo-grid" id="grid"></div><div id="more-wrap" hidden><button class="btn" id="more" type="button"></button></div></section>';
  view.querySelectorAll('.album-card .chip').forEach(function(c){
    c.addEventListener('click',function(){var a=bySlug(c.getAttribute('data-slug'));doShare(albumUrl(a),a.name+' · '+SITE.title,'Album')});
  });
  var shown=PAGE,setList=mountGrid($('#grid'),MIXED.slice(0,shown)),more=$('#more'),wrap=$('#more-wrap');
  function paintMore(){
    var left=MIXED.length-shown;wrap.hidden=left<=0;
    if(left>0)more.textContent='Show more photos ('+left+' more)';
  }
  more.addEventListener('click',function(){shown+=PAGE;setList(MIXED.slice(0,shown));paintMore()});
  paintMore();
}

function renderAlbum(a){
  setNav('home');
  view.innerHTML=
    '<div class="intro"><a class="crumb" href="#">‹ All photos</a><div class="head-line"><h1>'+a.name+'</h1><button class="btn share-btn" id="share-album" type="button">'+SHARE_ICON+'<span>Share album</span></button></div><p class="sub">'+a.blurb+' '+plural(a.photos.length,'photo')+'.</p></div>'+
    '<div class="photo-grid" id="grid"></div>';
  $('#share-album').addEventListener('click',function(){doShare(albumUrl(a),a.name+' · '+SITE.title,'Album')});
  mountGrid($('#grid'),a.photos);
}

function renderHow(){
  setNav('how');
  view.innerHTML=
    '<div class="intro"><h1>How it works</h1><p class="sub">You manage everything from one folder on your Mac. Publishing turns that folder into this site.</p></div>'+
    '<ul class="flow" aria-label="Overview"><li><span>Folder on your Mac</span></li><li><span>Publish</span></li><li><span>GitHub</span></li><li><span>mypicshow.github.io</span></li></ul>'+
    '<div class="how">'+
      '<ol class="steps">'+
        '<li><div><b>Make the folder</b><span>Create a folder called My Pic Show. Inside it, make one folder for each album. The folder name becomes the album name.</span></div></li>'+
        '<li><div><b>Drop your photos in</b><span>Use the full-size originals, straight from the camera. They stay on your Mac.</span></div></li>'+
        '<li><div><b>Publish</b><span>One command shrinks a web copy of every photo, builds the tiled pages and sends them to GitHub.</span></div></li>'+
        '<li><div><b>Share the link</b><span>The site updates within a couple of minutes. Each album also gets its own link to send.</span></div></li>'+
      '</ol>'+
      '<pre class="tree" aria-label="Example folder layout">My Pic Show/\n├── Coast/\n│   ├── low-tide.jpg\n│   └── headland.jpg\n├── Hills and Moors/\n│   └── ridge-line.jpg\n└── City Lights/\n    └── tram-lines.jpg</pre>'+
    '</div>'+
    '<section class="sec notes" aria-labelledby="h-sell"><h2 id="h-sell">Selling a photo</h2>'+
      '<p>Every photo has a <b>Buy</b> button that opens a Stripe or PayPal payment link. When someone pays, you get an email, then you send the full-resolution file or arrange a print.</p>'+
      '<p>Hosting on GitHub Pages is free. Stripe keeps a small cut of each sale and charges no monthly fee.</p>'+
      '<p><b>In this mock-up</b> the photos are drawn placeholders, the prices are examples, and the Buy buttons take no payment.</p>'+
    '</section>';
}

function route(first){
  cleanup.forEach(function(f){f()});cleanup=[];
  if(!lb.hidden)closeLB(false);
  var h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  var a=h.indexOf('album-')===0?bySlug(h.slice(6)):null;
  var m=/^photo-(.+?)--(.+)$/.exec(h),pa=m?bySlug(m[1]):null,pp=null;
  if(pa)pa.photos.forEach(function(x){if(x.id===m[2])pp=x});
  if(pp)renderAlbum(pa);
  else if(a)renderAlbum(a);else if(DEMO&&h==='how-it-works')renderHow();else renderHome();
  if(!first)window.scrollTo(0,0);
  if(pp)openLB(pp,null);
}

/* ---------- viewer ---------- */
var lb=$('#lb'),app=$('#app'),L={list:[],i:0,opener:null,album:null};
var strip=$('#lb-strip'),buyPanel=$('#buy-panel'),buyToggle=$('#buy-toggle'),buyNote=$('#buy-note'),buyOpts=$('#buy-opts');
var NOTE='Example prices. On your live site each button opens your Stripe or PayPal payment link.';
function ref(p){return p.album.slug+'--'+p.id}
/* Stripe payment links can carry a reference, so the order says which photo it was for. */
function buyHref(o,p){return /stripe\.com/i.test(o.link)?o.link+(o.link.indexOf('?')<0?'?':'&')+'client_reference_id='+encodeURIComponent(ref(p)):o.link}
function buildBuy(p){
  buyOpts.textContent='';
  SITE.buy.forEach(function(o){
    var el=document.createElement(o.link?'a':'button');el.className='opt';
    el.innerHTML='<span></span><small></small><b></b>';
    el.children[0].textContent=o.name;el.children[1].textContent=o.detail||'';el.children[2].textContent=o.price||'';
    if(o.link){el.href=buyHref(o,p);el.target='_blank';el.rel='noopener noreferrer'}
    else{
      el.type='button';el.setAttribute('aria-pressed','false');
      el.addEventListener('click',function(){
        buyOpts.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-pressed','false')});
        el.setAttribute('aria-pressed','true');
        buyNote.textContent=o.name+' selected. Demo only: nothing is charged here. Your live site would open your payment link now.';
      });
    }
    buyOpts.appendChild(el);
  });
  buyNote.textContent=DEMO?NOTE:'Payment opens in a new tab. Photo reference, if you are asked for one: '+ref(p);
}
function buildStrip(){
  strip.textContent='';
  L.list.forEach(function(p,i){
    var t=document.createElement('button');t.type='button';t.className='th';t.style.width=(52*p.ar)+'px';
    t.setAttribute('aria-label','Photo '+(i+1)+': '+p.title);
    var im=document.createElement('img');im.src=p.src;im.alt='';t.appendChild(im);
    t.addEventListener('click',function(){L.i=i;paintLB()});
    strip.appendChild(t);
  });
}
function paintLB(){
  var p=L.list[L.i];
  var im=$('#lb-img');
  if(p.srcset){im.sizes='100vw';im.srcset=p.srcset;im.src=p.full}else{im.removeAttribute('srcset');im.removeAttribute('sizes');im.src=p.src}
  im.alt=(DEMO?'Example photo: ':'')+p.title;
  $('#lb-title').textContent=p.title;
  $('#lb-meta').textContent=DEMO
    ?p.album.name+' · Web copy '+p.ww+' × '+p.wh+' px · Original '+p.ow+' × '+p.oh+' px, sent after purchase'
    :p.album.name+' · '+p.ow+' × '+p.oh+' px'+(SITE.buy.length?' · Full-size file sent after purchase':'');
  $('#lb-count').textContent=(L.i+1)+' / '+L.list.length;
  var al=$('#lb-album');al.href='#album-'+p.album.slug;al.textContent='‹ View album: '+p.album.name;
  var ths=strip.children;
  for(var i=0;i<ths.length;i++){
    if(i===L.i){ths[i].setAttribute('aria-current','true');strip.scrollLeft=ths[i].offsetLeft-strip.clientWidth/2+ths[i].offsetWidth/2}
    else ths[i].removeAttribute('aria-current');
  }
  buildBuy(p);
  buyToggle.hidden=!SITE.buy.length;
  if(!SITE.buy.length){buyPanel.hidden=true;buyToggle.setAttribute('aria-expanded','false')}
}
function openLB(p,opener){
  L.list=p.album.photos;L.i=p.idx;L.opener=opener;
  buildStrip();lb.hidden=false;app.inert=true;
  document.body.style.overflow='hidden';
  paintLB();$('#lb-close').focus();
}
function closeLB(restore){
  lb.hidden=true;app.inert=false;document.body.style.overflow='';
  if(restore!==false&&L.opener&&document.contains(L.opener))L.opener.focus();
}
function step(d){L.i=(L.i+d+L.list.length)%L.list.length;paintLB()}
$('#lb-close').addEventListener('click',function(){closeLB(true)});
$('#lb-prev').addEventListener('click',function(){step(-1)});
$('#lb-next').addEventListener('click',function(){step(1)});
$('#lb-album').addEventListener('click',function(){closeLB(false)});
$('#lb-share').addEventListener('click',function(){var p=L.list[L.i];doShare(photoUrl(p),p.title+' · '+SITE.title,'Photo')});
document.addEventListener('keydown',function(e){
  if(!sheet.hidden){if(e.key==='Escape')closeSheet();return}
  if(lb.hidden)return;
  if(e.key==='Escape')closeLB(true);
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowRight')step(1);
});
var sx=null;
$('#lb-stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
$('#lb-stage').addEventListener('touchend',function(e){
  if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>50)step(dx>0?-1:1);
},{passive:true});
buyToggle.addEventListener('click',function(){
  var open=buyPanel.hidden;buyPanel.hidden=!open;buyToggle.setAttribute('aria-expanded',String(open));
});

/* ---------- full screen: hides the header, footer and headings; the browser goes full screen too where it can ---------- */
var exitBtn=$('#exit-full');
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function isClean(){return document.body.classList.contains('clean')}
function enterFull(){
  document.body.classList.add('clean');
  var el=document.documentElement,rf=el.requestFullscreen||el.webkitRequestFullscreen;
  if(rf){try{var r=rf.call(el);if(r&&r.catch)r.catch(function(){})}catch(e){}}
}
function exitFull(){
  document.body.classList.remove('clean');
  var ex=document.exitFullscreen||document.webkitExitFullscreen;
  if(isFS()&&ex){try{var r=ex.call(document);if(r&&r.catch)r.catch(function(){})}catch(e){}}
}
function toggleFull(){if(isClean())exitFull();else enterFull()}
function onFS(){if(!isFS())document.body.classList.remove('clean')}
document.addEventListener('fullscreenchange',onFS);document.addEventListener('webkitfullscreenchange',onFS);
$('#full-btn').addEventListener('click',enterFull);
$('#lb-full').addEventListener('click',enterFull);
exitBtn.addEventListener('click',exitFull);
document.addEventListener('keydown',function(e){
  if(!sheet.hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'&&isClean()){exitFull();e.stopImmediatePropagation();return}
  if((e.key==='f'||e.key==='F')&&!/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')){toggleFull()}
},true);
$('#share-site').addEventListener('click',function(){doShare(siteUrl(),SITE.title,'Site')});

/* ---------- page furniture that depends on the gallery ---------- */
$('#brand-name').textContent=SITE.title;
$('#brand').setAttribute('aria-label',SITE.title+' home');
if(!DEMO)document.title=SITE.title;
$('#foot').textContent=DEMO
  ?'Mock-up with drawn example photos and example prices. Your own pictures replace them when you publish.'
  :'© '+new Date().getFullYear()+' '+SITE.title;

window.addEventListener('hashchange',function(){route(false)});
route(true);
}

/* ---------- start up ---------- */
if(DEMO){
  buildMixed();startApp();
}else{
  fetch('gallery.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(g){parseGallery(g);startApp()})
    .catch(function(){
      document.getElementById('view').innerHTML='<div class="intro"><h1>Photos are not loading</h1><p class="sub">The photo list could not be loaded. If you opened this file straight from a folder on your computer, open the website address instead, because browsers will not read the list from a local file. Otherwise, try again in a minute.</p></div>';
    });
}
</script>
