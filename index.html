<style>
/* Layout: sticky header and a full-width page, about 1 cm in from each edge. Photos sit in justified rows (Flickr-style mosaic). A full-screen viewer opens on top for a single photo. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#13201f; --muted:#566866; --line:#d8e1df; --tile:#e2eae8;
  --accent:#0a766f; --accent-fg:#ffffff;
  --lb-bg:#0a0f0f; --lb-fg:#eef4f3; --lb-muted:#9fb2af; --lb-line:#2a3a37; --lb-btn:#18221f; --lb-accent:#5ccfc6; --lb-accent-fg:#06211f;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Space Grotesk","Inter",system-ui,-apple-system,sans-serif;
  --font-brand:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --gap:6px; --gutter:clamp(16px,4vw,40px); --tab-line:#1f6feb; --head-line:#c3cdcb;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1413; --surface:#141d1c; --fg:#e7efee; --muted:#93a7a4; --line:#243230; --tile:#1b2625;
    --accent:#5ccfc6; --accent-fg:#06211f; --tab-line:#5aa2ff; --head-line:#3d4b49; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#141d1c; --fg:#e7efee; --muted:#93a7a4; --line:#243230; --tile:#1b2625;
  --accent:#5ccfc6; --accent-fg:#06211f; --tab-line:#5aa2ff; --head-line:#3d4b49; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--font-display);letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;font-weight:700}
h2{font-size:20px;line-height:1.2;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub{color:var(--muted);max-width:60ch}

.inner{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

/* header: logo left, tabs in the middle, buttons right */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:3px solid var(--head-line)}
.head-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"brand tabs actions";column-gap:16px;align-items:stretch}
.brand{grid-area:brand;justify-self:start;align-self:center;min-width:0;max-width:100%;display:inline-flex;align-items:center;gap:10px;padding-block:10px;font:500 20px/1 var(--font-brand);text-decoration:none}
.brand .logo{flex:none;width:48px;height:48px;border-radius:22.4%;box-shadow:0 0 0 1px var(--line)}
#brand-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{grid-area:tabs;display:flex;gap:clamp(18px,3vw,44px)}
.tab{display:flex;align-items:center;padding:0 2px;margin-bottom:-3px;border-bottom:3px solid transparent;color:var(--muted);font:500 16px/1 var(--font-brand);text-decoration:none;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--tab-line)}
.head-actions{grid-area:actions;justify-self:end;align-self:center;display:flex;align-items:center;gap:8px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap}
.hbtn:hover{border-color:var(--muted)}
@media (max-width:760px){
  .head-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand actions" "tabs tabs";column-gap:8px}
  .tabs{justify-content:center;height:44px}
}
@media (max-width:1500px){.hbtn{width:40px;padding:0}.hbtn span{display:none}}
@media (max-width:430px){.hbtn{width:36px;min-height:36px}.head-actions{gap:6px}}

/* page */
#view{display:flex;flex-direction:column;gap:28px;padding-block:28px 56px}
.intro{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:14px}
.crumb{display:inline-block;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:6px}
.crumb:hover{color:var(--fg)}

/* albums: square covers, name and count over a dark fade, a stacked-paper edge on top */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:40px 28px;padding-top:10px}
.acard{position:relative}
.acard::before,.acard::after{content:"";position:absolute;height:1px;background:var(--muted);pointer-events:none}
.acard::before{top:-9px;left:22px;right:22px;opacity:.45}
.acard::after{top:-5px;left:11px;right:11px;opacity:.8}
.acard-link{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;background:var(--tile);color:#fff;text-decoration:none}
.acard-link img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.acard-link:hover img,.acard-link:focus-visible img{transform:scale(1.03)}
.acard-link::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0,rgba(0,0,0,.55) 26%,rgba(0,0,0,0) 62%)}
.acard-text{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;flex-direction:column;gap:7px;padding:0 64px 20px 20px}
.acard-name{font:300 clamp(22px,1.9vw,32px)/1.12 var(--font-brand);text-shadow:0 1px 8px rgba(0,0,0,.4);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acard-meta{font:500 14px/1.2 var(--font-brand);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.acard-meta i{font-style:normal;margin:0 .3em}
@media (max-width:560px){
  .albums{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 14px}
  .acard-text{padding:0 12px 14px 14px}
  .acard-name{font-size:20px}
  .acard-meta{font-size:12.5px}
}

.photo-grid{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;gap:var(--gap)}
.tile{position:relative;display:block;min-width:0;border-radius:3px;overflow:hidden;background:var(--tile)}
.tile-btn{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.tile-btn img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.cap{position:absolute;inset:auto 0 0 0;padding:30px 10px 8px;text-align:left;font:500 13px/1.3 var(--font-body);color:#fff;background:linear-gradient(to top,rgba(0,0,0,.66),transparent);opacity:0;transition:opacity .15s}
.tile:hover .cap,.tile-btn:focus-visible .cap{opacity:1}
.tile-btn:focus-visible{outline-offset:-3px}

.btn{min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn-accent{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn-accent:hover{border-color:transparent;filter:brightness(1.08)}
.head-line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.share-btn{display:inline-flex;align-items:center;gap:8px}
.chip{position:absolute;top:8px;right:8px;z-index:2;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:rgba(10,15,15,.62);color:#fff;cursor:pointer;transition:opacity .15s,background .15s}
.chip:hover{background:rgba(10,15,15,.84)}
.acard .chip{top:auto;bottom:16px;right:16px;width:38px;height:38px}
@media (hover:hover){.acard .chip{opacity:0}.acard:hover .chip,.acard:focus-within .chip{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,12px);z-index:40;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:500;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:rgba(0,0,0,.5);padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.sheet-card input{min-width:0;min-height:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.sheet-card p{color:var(--muted);font-size:13px}

/* how it works */
.how{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px 40px;align-items:start}
@media (max-width:780px){.how{grid-template-columns:minmax(0,1fr)}}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.steps b{display:block;font-weight:600}
.steps span{color:var(--muted)}
.tree{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-x:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;list-style:none;margin:0;padding:0}
.flow li{display:flex;align-items:center;gap:8px}
.flow li+li::before{content:"\2192";color:var(--muted)}
.flow span{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500}
.notes{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.notes p{color:var(--muted)}
.notes b{color:var(--fg);font-weight:600}

.foot{padding-block:20px 32px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

/* photo viewer (dark in both themes) */
.lb{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto minmax(180px,1fr) auto auto auto;background:var(--lb-bg);color:var(--lb-fg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:auto}
.lb>*{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.lb :focus-visible{outline-color:var(--lb-accent)}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.lb-link{color:var(--lb-fg);text-decoration:none;font-weight:600;padding:8px 0}
.lb-link:hover{text-decoration:underline}
.lb-count{color:var(--lb-muted);font-variant-numeric:tabular-nums;margin-left:auto}
.lb-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--lb-line);background:var(--lb-btn);cursor:pointer}
.lb-btn:hover{border-color:var(--lb-muted)}
.lb-stage{position:relative;min-height:0}
.lb-stage img{position:absolute;inset:6px max(16px,env(safe-area-inset-left,0px));width:calc(100% - 2 * max(16px,env(safe-area-inset-left,0px)));height:calc(100% - 12px);object-fit:contain;-webkit-user-drag:none;user-select:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,15,15,.72)}
.lb-nav.prev{left:max(10px,env(safe-area-inset-left,0px))}
.lb-nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.lb-info{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px}
.lb-text{min-width:0;flex:1 1 260px}
.lb-text h2{font-size:18px}
.lb-text p{color:var(--lb-muted);font-size:13px;margin-top:2px}
.lb .btn-accent{background:var(--lb-accent);color:var(--lb-accent-fg)}
.lb .btn-ghost{background:var(--lb-btn);border-color:var(--lb-line);color:var(--lb-fg)}
.lb .btn-ghost:hover{border-color:var(--lb-muted)}
.lb-actions{display:flex;flex-wrap:wrap;gap:8px}
.buy{padding-bottom:12px}
.buy-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
a.opt{text-decoration:none;color:var(--lb-fg)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;padding:10px 12px;border-radius:6px;border:1px solid var(--lb-line);background:var(--lb-btn);cursor:pointer}
.opt:hover{border-color:var(--lb-muted)}
.opt[aria-pressed="true"]{border-color:var(--lb-accent)}
.opt span{font-weight:600}
.opt small{grid-column:1;color:var(--lb-muted);font-size:12.5px}
.opt b{grid-column:2;grid-row:1 / span 2;align-self:center;font-variant-numeric:tabular-nums}
.buy-note{margin-top:8px;color:var(--lb-muted);font-size:13px}
.lb-strip{position:relative;display:flex;gap:6px;overflow-x:auto;padding-block:6px 14px}
.th{flex:none;height:52px;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:var(--lb-btn);cursor:pointer;opacity:.6}
.th img{width:100%;height:100%;object-fit:cover}
.th[aria-current="true"]{border-color:var(--lb-accent);opacity:1}
/* full screen: the banner stays; headings and the footer go. In the photo viewer the title, thumbnails and buy panel go too. */
.exit-full{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));z-index:35;width:44px;height:44px;padding:0;place-items:center;border:0;border-radius:50%;background:rgba(10,15,15,.66);color:#fff;cursor:pointer}
.exit-full:hover{background:rgba(10,15,15,.88)}
body.clean .lb:not([hidden]) ~ .exit-full{display:grid}
body.clean .foot,body.clean .intro{display:none}
body.clean #view{padding-block:16px 12px}
body.clean .lb{grid-template-rows:minmax(0,1fr)}
body.clean .lb-top,body.clean .lb-info,body.clean .buy,body.clean .lb-strip{display:none}
/* phone held sideways: the viewer becomes just the picture, edge to edge. Swipe for the next one; tap to bring the buttons back. */
@media (orientation:landscape) and (max-height:520px){
  /* The viewer scrolls a little (the picture stays put) so a swipe up lets Safari tuck its bars away. */
  .lb{display:block;padding:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#000}
  .lb::after{content:"";display:block;height:160px}
  .lb>.lb-stage{padding:0;min-height:0;position:sticky;top:0;height:100%}
  .lb-stage img{inset:0;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:100%}
  .lb-nav,.lb-info,.buy,.lb-strip,#lb-full,body.clean .lb:not([hidden]) ~ .exit-full{display:none}
  .lb>.lb-top,body.clean .lb>.lb-top{display:flex;position:fixed;top:0;left:0;right:0;z-index:3;padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.65),transparent);opacity:0;pointer-events:none;transition:opacity .25s}
  .lb.ui>.lb-top,body.clean .lb.ui>.lb-top{opacity:1;pointer-events:auto}
}
/* slideshow: black, one photo at a time, built to be mirrored to a TV */
.show{position:fixed;inset:0;z-index:30;background:#000;color:#fff;overflow:hidden;cursor:default}
.show.idle{cursor:none}
.show-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .9s ease;-webkit-user-drag:none;user-select:none}
.show-img.on{opacity:1}
.show-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;transition:opacity .35s}
.show.idle .show-ui{opacity:0}
.show-ui>*{pointer-events:auto}
.show-top{display:flex;justify-content:flex-end}
.show-bar{align-self:center;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:rgba(10,15,15,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.show .lb-btn{background:rgba(10,15,15,.72);border-color:rgba(255,255,255,.18);color:#fff}
.show-bar .lb-btn{border:0;background:transparent;width:40px;height:40px}
.show-bar .lb-btn:hover,.show .lb-btn:hover{background:rgba(255,255,255,.16)}
.show-count{min-width:5.5em;text-align:center;color:#cfdcda;font-variant-numeric:tabular-nums;font-size:14px}
.show-speed{min-width:44px;height:40px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:#fff;font-weight:600;cursor:pointer}
.show-speed:hover{background:rgba(255,255,255,.16)}
@media (max-width:560px){:root{--gap:4px}.lb-nav{width:40px;height:40px}.acard .chip{top:10px;bottom:auto;right:10px;width:34px;height:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <header class="site-head">
    <div class="inner head-row">
      <a class="brand" id="brand" href="#" aria-label="My Pic Show home">
        <img class="logo" src="icon.svg" alt="" width="32" height="32">        <span id="brand-name">My Pic Show</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a class="tab" href="#" data-r="all">All photos</a>
        <a class="tab" href="#albums" data-r="albums">Albums</a>
      </nav>
      <div class="head-actions">
        <button class="hbtn" id="show-btn" type="button" aria-label="Slideshow" title="Slideshow"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 8.5v4.5l4-2.25z" fill="currentColor"/><path d="M8 21h8"/></svg><span>Slideshow</span></button>
        <button class="hbtn" id="full-btn" type="button" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full screen</span></button>
        <button class="hbtn" id="share-site" type="button" aria-label="Share site" title="Share site"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Share site</span></button>
        <button class="hbtn" id="theme-btn" type="button"></button>
      </div>
    </div>
  </header>
  <main class="inner" id="view"><p class="sub">Loading photos…</p></main>

<script>
var DEMO=/*MODE*/false/*/MODE*/;
var ALBUMS=[],PHOTOS=[],MIXED=[],SITE={title:'My Pic Show',short:'MPS',buy:[]};
function slugify(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}


/* The front page: every photo from every album, shuffled, so tall and wide shapes mix. The order is fixed for the visit and changes next time. */
function buildMixed(){
  MIXED=PHOTOS.slice();
  for(var i=MIXED.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=MIXED[i];MIXED[i]=MIXED[j];MIXED[j]=t}
}

/* Turn gallery.json (written by publish.sh) into the album and photo lists the page uses.
   File names follow one pattern: photos/<album>/<id>-thumb.jpg, -medium.jpg and -large.jpg. */
function parseGallery(g){
  SITE.title=g.title||'My Pic Show';SITE.short=g.short||SITE.title;
  SITE.buy=(g.buy||[]).filter(function(o){return o&&o.link});
  ALBUMS=[];PHOTOS=[];
  (g.albums||[]).forEach(function(ga){
    var a={name:ga.name,slug:ga.slug,blurb:ga.blurb||'',photos:[]};
    (ga.photos||[]).forEach(function(gp,pi){
      var base='photos/'+ga.slug+'/'+gp.id,t=gp.t,m=gp.m,l=gp.l;
      var sets=[[base+'-thumb.jpg',t[0]],[base+'-medium.jpg',m[0]],[base+'-large.jpg',l[0]]].sort(function(x,y){return x[1]-y[1]});
      var seen={},ss=[];
      sets.forEach(function(s){if(!seen[s[1]]){seen[s[1]]=1;ss.push(s[0]+' '+s[1]+'w')}});
      var p={id:gp.id,title:gp.title,ar:l[0]/l[1],album:a,idx:pi,d:gp.d||'',ow:gp.ow,oh:gp.oh,ww:l[0],wh:l[1],
        src:base+'-thumb.jpg',full:base+'-medium.jpg',big:base+'-large.jpg',share:base+'-share.jpg',srcset:ss.join(', ')};
      a.photos.push(p);PHOTOS.push(p);
    });
    if(a.photos.length){a.cover=a.photos[0].src;ALBUMS.push(a)}
  });
  buildMixed();
}

function startApp(){
var $=function(s,el){return (el||document).querySelector(s)};
var root=document.documentElement;

/* ---------- theme: follows the device, button flips it, choice is remembered ---------- */
var KEY='mypicshow-theme',tbtn=$('#theme-btn');
var SUN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var mq=window.matchMedia('(prefers-color-scheme: dark)');
function effective(){return root.getAttribute('data-theme')||(mq.matches?'dark':'light')}
function paintBtn(){var d=effective()==='dark';tbtn.innerHTML=(d?SUN:MOON)+'<span>'+(d?'Light':'Dark')+'</span>';tbtn.setAttribute('aria-label','Switch to '+(d?'light':'dark')+' mode');tbtn.title='Switch to '+(d?'light':'dark')+' mode'}
try{var sv=localStorage.getItem(KEY);if(sv==='light'||sv==='dark')root.setAttribute('data-theme',sv)}catch(e){}
tbtn.addEventListener('click',function(){var n=effective()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem(KEY,n)}catch(e){}paintBtn()});
if(mq.addEventListener)mq.addEventListener('change',paintBtn);
paintBtn();

/* ---------- sharing: phone share sheet where available, otherwise copy the link ---------- */
var SHARE_ICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function baseUrl(){return location.href.split('#')[0]}
function siteUrl(){return baseUrl()}
function bySlug(s){return ALBUMS.filter(function(x){return x.slug===s})[0]}
function albumUrl(a){return baseUrl()+'#album-'+a.slug}
function photoUrl(p){return baseUrl()+'#photo-'+p.album.slug+'--'+p.id}
var toastEl=$('#toast'),toastT=0,sheet=$('#sheet'),sheetInp=$('#sheet-link'),sheetTitle=$('#sheet-title'),sheetFrom=null;
function toast(msg,ms){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on')},ms||2400)}
function openSheet(url,what){sheetFrom=document.activeElement;sheetTitle.textContent=what+' link';sheetInp.value=url;sheet.hidden=false;sheetInp.focus();sheetInp.select()}
function closeSheet(){sheet.hidden=true;if(sheetFrom&&document.contains(sheetFrom))sheetFrom.focus()}
function copyLink(url,what){
  var p;try{p=navigator.clipboard.writeText(url)}catch(e){p=Promise.reject(e)}
  p.then(function(){toast(what+' link copied')},function(){openSheet(url,what)});
}
function doShare(url,title,what){
  if(navigator.share){
    var s;try{s=navigator.share({title:title,url:url})}catch(e){s=Promise.reject(e)}
    s.catch(function(e){if(!(e&&e.name==='AbortError'))copyLink(url,what)});
    return;
  }
  copyLink(url,what);
}
$('#sheet-done').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});

/* ---------- justified rows ---------- */
var view=$('#view'),cleanup=[];
function tileEl(p){
  var t=document.createElement('div');t.className='tile';
  var b=document.createElement('button');b.type='button';b.className='tile-btn';
  b.setAttribute('aria-label','Open '+p.title+', '+p.album.name);
  var img=document.createElement('img');img.loading='lazy';img.decoding='async';img.src=p.src;img.alt='';img.draggable=false;
  var cap=document.createElement('span');cap.className='cap';cap.textContent=p.title;
  b.appendChild(img);b.appendChild(cap);
  b.addEventListener('click',function(){openLB(p,b)});
  t.appendChild(b);
  return t;
}
/* A repeatable pseudo-random number for row i (0 to 1), so rows keep their shape when the window is resized. */
function rnd(i){var x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
/* Rows are filled until they reach about the target height. Each row aims a little taller or shorter than the last, and the last photo only joins a row if that gets the row closer to its target. */
function justify(box,photos){
  var W=Math.floor(box.clientWidth);if(!W)return;
  var gap=parseFloat(getComputedStyle(box).getPropertyValue('--gap'))||6;
  var base=W<520?194:W<900?286:346;
  box.textContent='';
  var row=[],sum=0,ri=0;
  function aim(){return base*(.9+.2*rnd(ri+1))}
  function flush(last){
    var h=(W-gap*(row.length-1))/sum,full=true;
    if(last&&h>base*1.25){h=base;full=false}
    var el=document.createElement('div');el.className='row';el.style.height=h+'px';
    row.forEach(function(p){var t=tileEl(p);if(full)t.style.flex=p.ar+' 1 0px';else t.style.width=(h*p.ar)+'px';el.appendChild(t)});
    box.appendChild(el);row=[];sum=0;ri++;
  }
  photos.forEach(function(p){
    var tg=aim(),n=row.length,hWith=(W-gap*n)/(sum+p.ar);
    if(hWith>tg){row.push(p);sum+=p.ar;return}
    var hWithout=n?(W-gap*(n-1))/sum:Infinity;
    if(n&&Math.abs(hWithout-tg)<Math.abs(hWith-tg)){
      flush(false);row=[p];sum=p.ar;
      if(W/p.ar<=aim())flush(false);
    }else{row.push(p);sum+=p.ar;flush(false)}
  });
  if(row.length)flush(true);
}
function mountGrid(box,photos){
  var lastW=0;
  function draw(){var w=box.clientWidth;if(w===lastW)return;lastW=w;justify(box,photos)}
  function setList(list){photos=list;lastW=0;draw()}
  draw();
  if('ResizeObserver' in window){var ro=new ResizeObserver(draw);ro.observe(box);cleanup.push(function(){ro.disconnect()})}
  else{window.addEventListener('resize',draw);cleanup.push(function(){window.removeEventListener('resize',draw)})}
  return setList;
}

/* ---------- views ---------- */
function setNav(r){document.querySelectorAll('.tab').forEach(function(a){if(a.getAttribute('data-r')===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||''),mo=m?+m[2]:0;return mo>=1&&mo<=12?(+m[3])+' '+MON[mo-1]+' '+m[1]:''}
/* An album's date is the date of its newest photo. */
function albumDate(a){var best='';a.photos.forEach(function(p){if(p.d&&p.d>best)best=p.d});return fmtDate(best)}

var PAGE=60,CUR=null;
/* All photos: the front page, just the mixed tiles */
function renderHome(){
  setNav('all');CUR=null;
  view.innerHTML=
    '<h1 class="sr">All photos</h1><div class="photo-grid" id="grid"></div><div id="more-wrap" hidden><button class="btn" id="more" type="button"></button></div>';
  var shown=PAGE,setList=mountGrid($('#grid'),MIXED.slice(0,shown)),more=$('#more'),wrap=$('#more-wrap');
  function paintMore(){
    var left=MIXED.length-shown;wrap.hidden=left<=0;
    if(left>0)more.textContent='Show more photos ('+left+' more)';
  }
  more.addEventListener('click',function(){shown+=PAGE;setList(MIXED.slice(0,shown));paintMore()});
  paintMore();
}

/* Albums: square covers with the name, photo count and date over a dark fade */
function renderAlbums(){
  setNav('albums');CUR=null;
  var cards=ALBUMS.map(function(a){
    var dt=albumDate(a);
    return '<div class="acard"><a class="acard-link" href="#album-'+a.slug+'"><img src="'+a.cover+'" alt="" loading="lazy" decoding="async"><span class="acard-text"><span class="acard-name">'+esc(a.name)+'</span><span class="acard-meta">'+plural(a.photos.length,'photo')+(dt?' <i aria-hidden="true">\u2022</i> '+dt:'')+'</span></span></a><button class="chip" type="button" data-slug="'+a.slug+'" aria-label="Share album: '+esc(a.name)+'">'+SHARE_ICON+'</button></div>';
  }).join('');
  view.innerHTML='<h1 class="sr">Albums</h1><div class="albums">'+cards+'</div>';
  view.querySelectorAll('.acard .chip').forEach(function(c){
    c.addEventListener('click',function(){var a=bySlug(c.getAttribute('data-slug'));doShare(albumUrl(a),a.name+' \u00b7 '+SITE.title,'Album')});
  });
}

function renderAlbum(a){
  setNav('albums');CUR=a;
  var dt=albumDate(a);
  view.innerHTML=
    '<div class="intro"><a class="crumb" href="#albums">\u2039 Albums</a><div class="head-line"><h1>'+esc(a.name)+'</h1><button class="btn share-btn" id="share-album" type="button">'+SHARE_ICON+'<span>Share album</span></button></div><p class="sub">'+(a.blurb?esc(a.blurb)+' ':'')+plural(a.photos.length,'photo')+(dt?' \u00b7 '+dt:'')+'</p></div>'+
    '<div class="photo-grid" id="grid"></div>';
  $('#share-album').addEventListener('click',function(){doShare(albumUrl(a),a.name+' \u00b7 '+SITE.title,'Album')});
  mountGrid($('#grid'),a.photos);
}

function renderHow(){
  setNav('how');CUR=null;
  view.innerHTML=
    '<div class="intro"><h1>How it works</h1><p class="sub">You manage everything from one folder on your Mac. Publishing turns that folder into this site.</p></div>'+
    '<ul class="flow" aria-label="Overview"><li><span>Folder on your Mac</span></li><li><span>Publish</span></li><li><span>GitHub</span></li><li><span>mypicshow.github.io</span></li></ul>'+
    '<div class="how">'+
      '<ol class="steps">'+
        '<li><div><b>Make the folder</b><span>Create a folder called My Pic Show. Inside it, make one folder for each album. The folder name becomes the album name.</span></div></li>'+
        '<li><div><b>Drop your photos in</b><span>Use the full-size originals, straight from the camera. They stay on your Mac.</span></div></li>'+
        '<li><div><b>Publish</b><span>One command shrinks a web copy of every photo, builds the tiled pages and sends them to GitHub.</span></div></li>'+
        '<li><div><b>Share the link</b><span>The site updates within a couple of minutes. Each album also gets its own link to send.</span></div></li>'+
      '</ol>'+
      '<pre class="tree" aria-label="Example folder layout">My Pic Show/\n├── Coast/\n│   ├── low-tide.jpg\n│   └── headland.jpg\n├── Hills and Moors/\n│   └── ridge-line.jpg\n└── City Lights/\n    └── tram-lines.jpg</pre>'+
    '</div>'+
    '<section class="sec notes" aria-labelledby="h-sell"><h2 id="h-sell">Selling a photo</h2>'+
      '<p>Every photo has a <b>Buy</b> button that opens a Stripe or PayPal payment link. When someone pays, you get an email, then you send the full-resolution file or arrange a print.</p>'+
      '<p>Hosting on GitHub Pages is free. Stripe keeps a small cut of each sale and charges no monthly fee.</p>'+
      '<p><b>In this mock-up</b> the photos are drawn placeholders, the prices are examples, and the Buy buttons take no payment.</p>'+
    '</section>';
}

function route(first){
  cleanup.forEach(function(f){f()});cleanup=[];
  if(!showEl.hidden)closeShow();
  if(!lb.hidden)closeLB(false);
  var h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  var a=h.indexOf('album-')===0?bySlug(h.slice(6)):null;
  var m=/^photo-(.+?)--(.+)$/.exec(h),pa=m?bySlug(m[1]):null,pp=null;
  if(pa)pa.photos.forEach(function(x){if(x.id===m[2])pp=x});
  if(pp)renderAlbum(pa);
  else if(a)renderAlbum(a);else if(h==='albums')renderAlbums();else if(DEMO&&h==='how-it-works')renderHow();else renderHome();
  if(!first)window.scrollTo(0,0);
  if(pp)openLB(pp,null);
}

/* ---------- viewer ---------- */
var lb=$('#lb'),app=$('#app'),L={list:[],i:0,opener:null,album:null};
var strip=$('#lb-strip'),buyPanel=$('#buy-panel'),buyToggle=$('#buy-toggle'),buyNote=$('#buy-note'),buyOpts=$('#buy-opts');
var NOTE='Example prices. On your live site each button opens your Stripe or PayPal payment link.';
function ref(p){return p.album.slug+'--'+p.id}
/* Stripe payment links can carry a reference, so the order says which photo it was for. */
function buyHref(o,p){return /stripe\.com/i.test(o.link)?o.link+(o.link.indexOf('?')<0?'?':'&')+'client_reference_id='+encodeURIComponent(ref(p)):o.link}
function buildBuy(p){
  buyOpts.textContent='';
  SITE.buy.forEach(function(o){
    var el=document.createElement(o.link?'a':'button');el.className='opt';
    el.innerHTML='<span></span><small></small><b></b>';
    el.children[0].textContent=o.name;el.children[1].textContent=o.detail||'';el.children[2].textContent=o.price||'';
    if(o.link){el.href=buyHref(o,p);el.target='_blank';el.rel='noopener noreferrer'}
    else{
      el.type='button';el.setAttribute('aria-pressed','false');
      el.addEventListener('click',function(){
        buyOpts.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-pressed','false')});
        el.setAttribute('aria-pressed','true');
        buyNote.textContent=o.name+' selected. Demo only: nothing is charged here. Your live site would open your payment link now.';
      });
    }
    buyOpts.appendChild(el);
  });
  buyNote.textContent=DEMO?NOTE:'Payment opens in a new tab. Photo reference, if you are asked for one: '+ref(p);
}
function buildStrip(){
  strip.textContent='';
  L.list.forEach(function(p,i){
    var t=document.createElement('button');t.type='button';t.className='th';t.style.width=(52*p.ar)+'px';
    t.setAttribute('aria-label','Photo '+(i+1)+': '+p.title);
    var im=document.createElement('img');im.src=p.src;im.alt='';t.appendChild(im);
    t.addEventListener('click',function(){L.i=i;paintLB()});
    strip.appendChild(t);
  });
}
function paintLB(){
  var p=L.list[L.i];
  var im=$('#lb-img');
  if(p.srcset){im.sizes='100vw';im.srcset=p.srcset;im.src=p.full}else{im.removeAttribute('srcset');im.removeAttribute('sizes');im.src=p.src}
  im.alt=(DEMO?'Example photo: ':'')+p.title;
  $('#lb-title').textContent=p.title;
  $('#lb-meta').textContent=DEMO
    ?p.album.name+' · Web copy '+p.ww+' × '+p.wh+' px · Original '+p.ow+' × '+p.oh+' px, sent after purchase'
    :p.album.name+' · '+p.ow+' × '+p.oh+' px'+(SITE.buy.length?' · Full-size file sent after purchase':'');
  $('#lb-count').textContent=(L.i+1)+' / '+L.list.length;
  var al=$('#lb-album');al.href='#album-'+p.album.slug;al.textContent='‹ View album: '+p.album.name;
  var ths=strip.children;
  for(var i=0;i<ths.length;i++){
    if(i===L.i){ths[i].setAttribute('aria-current','true');strip.scrollLeft=ths[i].offsetLeft-strip.clientWidth/2+ths[i].offsetWidth/2}
    else ths[i].removeAttribute('aria-current');
  }
  buildBuy(p);prefetchShare(p);
  [1,-1].forEach(function(d){var n=L.list[(L.i+d+L.list.length)%L.list.length];if(n&&n!==p){var pre=new Image();pre.src=n.full||n.src}});
  buyToggle.hidden=!SITE.buy.length;
  if(!SITE.buy.length){buyPanel.hidden=true;buyToggle.setAttribute('aria-expanded','false')}
}
function openLB(p,opener){
  L.list=p.album.photos;L.i=p.idx;L.opener=opener;
  buildStrip();lb.hidden=false;app.inert=true;
  document.body.style.overflow='hidden';
  paintLB();$('#lb-close').focus();
}
function closeLB(restore){
  lb.hidden=true;app.inert=false;document.body.style.overflow='';hideUI();
  if(restore!==false&&L.opener&&document.contains(L.opener))L.opener.focus();
}
function step(d){L.i=(L.i+d+L.list.length)%L.list.length;paintLB()}
$('#lb-close').addEventListener('click',function(){closeLB(true)});
$('#lb-prev').addEventListener('click',function(){step(-1)});
$('#lb-next').addEventListener('click',function(){step(1)});
$('#lb-album').addEventListener('click',function(){closeLB(false)});
/* Share photo sends a small copy (about 1600 px) as a picture where the device can, and otherwise a link. The small copy is fetched ahead of time so the share sheet opens straight away. */
var shareFiles={};
function prefetchShare(p){
  var k=ref(p);if(!p.share||!navigator.canShare||k in shareFiles)return;
  shareFiles[k]=null;
  fetch(p.share).then(function(r){if(!r.ok)throw new Error('missing');return r.blob()})
    .then(function(b){shareFiles[k]=new File([b],p.id+'.jpg',{type:'image/jpeg'})})
    .catch(function(){delete shareFiles[k]});
}
function sharePhoto(p){
  var f=shareFiles[ref(p)],label=p.title+' \u00b7 '+SITE.title;
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    var s;try{s=navigator.share({files:[f],title:label,text:label+'\n'+photoUrl(p)})}catch(e){s=Promise.reject(e)}
    s.catch(function(e){if(!(e&&e.name==='AbortError'))doShare(photoUrl(p),label,'Photo')});
    return;
  }
  doShare(photoUrl(p),label,'Photo');
}
$('#lb-share').addEventListener('click',function(){sharePhoto(L.list[L.i])});
document.addEventListener('keydown',function(e){
  if(!sheet.hidden){if(e.key==='Escape')closeSheet();return}
  if(!showEl.hidden){
    if(e.key==='Escape')closeShow();
    else if(e.key==='ArrowLeft'){showStep(-1);wake()}
    else if(e.key==='ArrowRight'){showStep(1);wake()}
    else if(e.key===' '){e.preventDefault();togglePlay()}
    else wake();
    return;
  }
  if(lb.hidden)return;
  if(e.key==='Escape')closeLB(true);
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowRight')step(1);
});
/* sideways on a phone: tap the picture to show or hide the buttons (they hide again after 3 seconds) */
var land=window.matchMedia('(orientation:landscape) and (max-height:520px)'),uiTimer=null;
function hideUI(){clearTimeout(uiTimer);lb.classList.remove('ui')}
function showUI(){lb.classList.add('ui');clearTimeout(uiTimer);uiTimer=setTimeout(hideUI,3000)}
$('#lb-stage').addEventListener('click',function(){if(!land.matches)return;if(lb.classList.contains('ui'))hideUI();else showUI()});
lb.addEventListener('click',function(e){if(land.matches&&lb.classList.contains('ui')&&e.target.closest('.lb-top'))showUI()});
var onLand=function(){hideUI()};
if(land.addEventListener)land.addEventListener('change',onLand);else if(land.addListener)land.addListener(onLand);
var sx=null,sy=0;
$('#lb-stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('#lb-stage').addEventListener('touchend',function(e){
  if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx>0?-1:1);
},{passive:true});
buyToggle.addEventListener('click',function(){
  var open=buyPanel.hidden;buyPanel.hidden=!open;buyToggle.setAttribute('aria-expanded',String(open));
});

/* ---------- full screen: keeps the banner, hides headings and the footer; the browser goes full screen too where it can ---------- */
var exitBtn=$('#exit-full'),fullBtn=$('#full-btn');
var EXPAND='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
var SHRINK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function paintFull(){var on=document.body.classList.contains('clean'),t=on?'Exit full screen':'Full screen';fullBtn.innerHTML=(on?SHRINK:EXPAND)+'<span>'+t+'</span>';fullBtn.setAttribute('aria-label',t);fullBtn.title=t}
/* iPhones cannot take a web page full screen, so the page button would do nothing useful there. */
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&/iPhone|iPod/.test(navigator.userAgent))fullBtn.hidden=true;
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function isClean(){return document.body.classList.contains('clean')}
function enterFull(){
  document.body.classList.add('clean');paintFull();
  var el=document.documentElement,rf=el.requestFullscreen||el.webkitRequestFullscreen;
  if(rf){try{var r=rf.call(el);if(r&&r.catch)r.catch(function(){})}catch(e){}}
}
function exitFull(){
  document.body.classList.remove('clean');paintFull();
  var ex=document.exitFullscreen||document.webkitExitFullscreen;
  if(isFS()&&ex){try{var r=ex.call(document);if(r&&r.catch)r.catch(function(){})}catch(e){}}
}
function toggleFull(){if(isClean())exitFull();else enterFull()}
function onFS(){
  if(!isFS()){document.body.classList.remove('clean');paintFull();if(!showEl.hidden&&S.fs)closeShow()}
  else if(!showEl.hidden)S.fs=true;
}
document.addEventListener('fullscreenchange',onFS);document.addEventListener('webkitfullscreenchange',onFS);
fullBtn.addEventListener('click',toggleFull);paintFull();
$('#lb-full').addEventListener('click',enterFull);
exitBtn.addEventListener('click',exitFull);
document.addEventListener('keydown',function(e){
  if(!sheet.hidden||!showEl.hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'&&isClean()){exitFull();e.stopImmediatePropagation();return}
  if((e.key==='f'||e.key==='F')&&!/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')){toggleFull()}
},true);
$('#share-site').addEventListener('click',function(){doShare(siteUrl(),SITE.title,'Site')});

/* ---------- slideshow: one photo at a time, full screen, made to be mirrored to a TV ---------- */
var showEl=$('#show'),imgs=[$('#show-a'),$('#show-b')],S={list:[],i:0,secs:6,playing:true,front:1,timer:0,idle:0,fs:false,from:null,wl:null,errs:0},SPEEDS=[4,6,10,15];
var PAUSE_I='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
var PLAY_I='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
function showUrl(p){return p.big||p.src}
function setPP(){var b=$('#show-pp');b.innerHTML=S.playing?PAUSE_I:PLAY_I;b.setAttribute('aria-label',S.playing?'Pause slideshow':'Play slideshow')}
function wake(){showEl.classList.remove('idle');clearTimeout(S.idle);S.idle=setTimeout(function(){showEl.classList.add('idle')},3500)}
function schedule(){clearTimeout(S.timer);if(S.playing&&!showEl.hidden&&S.list.length>1)S.timer=setTimeout(function(){showStep(1)},S.secs*1000)}
function paintShow(){
  var p=S.list[S.i],im=imgs[1-S.front],url=showUrl(p),n=S.list.length;
  $('#show-count').textContent=(S.i+1)+' / '+n;
  function done(){
    if(showEl.hidden)return;
    S.errs=0;im.classList.add('on');imgs[S.front].classList.remove('on');S.front=1-S.front;schedule();
    var nx=S.list[(S.i+1)%n];if(nx&&nx!==p)new Image().src=showUrl(nx);
  }
  im.onload=function(){im.onload=im.onerror=null;done()};
  im.onerror=function(){im.onload=im.onerror=null;if(++S.errs<n)showStep(1)};
  im.alt=(DEMO?'Example photo: ':'')+p.title;
  if(im.getAttribute('src')===url&&im.complete&&im.naturalWidth){im.onload=im.onerror=null;done()}else im.src=url;
}
function showStep(d){clearTimeout(S.timer);S.i=(S.i+d+S.list.length)%S.list.length;paintShow()}
function togglePlay(){S.playing=!S.playing;setPP();if(S.playing)schedule();else clearTimeout(S.timer);wake()}
function getWake(){if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){S.wl=l}).catch(function(){})}
function openShow(list,i,opener){
  if(!list.length)return;
  S.list=list;S.i=i||0;S.playing=true;S.errs=0;S.from=opener||document.activeElement;S.front=1;
  imgs.forEach(function(m){m.classList.remove('on');m.removeAttribute('src')});
  showEl.hidden=false;app.inert=true;lb.inert=true;document.body.style.overflow='hidden';
  setPP();$('#show-speed').textContent=S.secs+'s';
  var de=document.documentElement,rf=de.requestFullscreen||de.webkitRequestFullscreen;
  if(rf&&!isFS()){try{var r=rf.call(de);if(r&&r.catch)r.catch(function(){})}catch(e){}}
  getWake();wake();paintShow();
  showEl.tabIndex=-1;showEl.focus({preventScroll:true});
  try{if(navigator.maxTouchPoints>1&&!localStorage.getItem('mypicshow-tv-tip')){localStorage.setItem('mypicshow-tv-tip','1');toast('To show this on an Apple TV, use Screen Mirroring in Control Centre.',7000)}}catch(e){}
}
function closeShow(){
  if(showEl.hidden)return;
  showEl.hidden=true;clearTimeout(S.timer);clearTimeout(S.idle);
  if(S.wl){try{S.wl.release()}catch(e){}S.wl=null}
  var wasFS=S.fs;S.fs=false;
  if(wasFS&&isFS()&&!isClean()){var ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex){try{var r=ex.call(document);if(r&&r.catch)r.catch(function(){})}catch(e){}}}
  lb.inert=false;if(lb.hidden)app.inert=false;
  document.body.style.overflow=lb.hidden?'':'hidden';
  if(lb.hidden&&S.from&&document.contains(S.from))S.from.focus();
}
$('#show-btn').addEventListener('click',function(){openShow(CUR?CUR.photos:MIXED,0,this)});
$('#lb-play').addEventListener('click',function(){openShow(L.list,L.i,this)});
$('#show-close').addEventListener('click',closeShow);
$('#show-prev').addEventListener('click',function(){showStep(-1);wake()});
$('#show-next').addEventListener('click',function(){showStep(1);wake()});
$('#show-pp').addEventListener('click',togglePlay);
$('#show-speed').addEventListener('click',function(){S.secs=SPEEDS[(SPEEDS.indexOf(S.secs)+1)%SPEEDS.length];this.textContent=S.secs+'s';schedule();wake()});
showEl.addEventListener('mousemove',wake);
showEl.addEventListener('click',function(e){
  if(e.target.closest('button'))return;
  if(showEl.classList.contains('idle'))wake();else{showEl.classList.add('idle');clearTimeout(S.idle)}
});
var sx2=null;
showEl.addEventListener('touchstart',function(e){sx2=e.touches[0].clientX},{passive:true});
showEl.addEventListener('touchend',function(e){
  if(sx2===null)return;var dx=e.changedTouches[0].clientX-sx2;sx2=null;
  if(Math.abs(dx)>50){showStep(dx>0?-1:1);wake()}
},{passive:true});
document.addEventListener('visibilitychange',function(){if(!showEl.hidden&&document.visibilityState==='visible')getWake()});

/* ---------- page furniture that depends on the gallery ---------- */
$('#brand-name').textContent=SITE.title;
$('#brand').setAttribute('aria-label',SITE.title+' home');
if(!DEMO)document.title=SITE.title;
$('#foot').textContent=DEMO
  ?'Mock-up with drawn example photos and example prices. Your own pictures replace them when you publish.'
  :'© '+new Date().getFullYear()+' '+SITE.title;

window.addEventListener('hashchange',function(){route(false)});
route(true);
}

/* ---------- start up ---------- */
if(DEMO){
  buildMixed();startApp();
}else{
  fetch('gallery.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(g){parseGallery(g);startApp()})
    .catch(function(){
      document.getElementById('view').innerHTML='<div class="intro"><h1>Photos are not loading</h1><p class="sub">The photo list could not be loaded. If you opened this file straight from a folder on your computer, open the website address instead, because browsers will not read the list from a local file. Otherwise, try again in a minute.</p></div>';
    });
}
</script>
</body>
</html>
